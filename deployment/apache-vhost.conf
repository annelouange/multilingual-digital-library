<VirtualHost *:443>
    ServerName library.example.com
    DocumentRoot /var/www/multilingual-digital-library/dist

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/library.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/library.example.com/privkey.pem

    Alias /backend /var/www/multilingual-digital-library/backend

    <Directory /var/www/multilingual-digital-library/dist>
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/multilingual-digital-library/backend>
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/multilingual-library-error.log
    CustomLog ${APACHE_LOG_DIR}/multilingual-library-access.log combined
</VirtualHost>
