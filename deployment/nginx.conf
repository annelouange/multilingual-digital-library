server {
    listen 80;
    server_name library.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name library.example.com;

    root /var/www/multilingual-digital-library/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/library.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/library.example.com/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /backend/ {
        alias /var/www/multilingual-digital-library/backend/;
        try_files $uri $uri/ /backend/index.php?$query_string;
    }

    location ~ ^/backend/(.+\.php)$ {
        alias /var/www/multilingual-digital-library/backend/$1;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/multilingual-digital-library/backend/$1;
        fastcgi_param DOCUMENT_ROOT /var/www/multilingual-digital-library/backend;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    location ~* ^/backend/uploads/.*\.(php|phtml|phar|cgi|pl|asp|aspx|jsp|sh|ps1|bat|cmd|exe|dll)$ {
        deny all;
    }

    location / {
        try_files $uri /index.html;
    }
}
